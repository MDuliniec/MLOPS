---
- name: Configure host-only network interface
  ansible.builtin.template:
    src: host_only.yaml.j2
    dest: /etc/netplan/60-vagrant-host-only.yaml
    mode: "0600"
  notify: Apply netplan

- name: Ensure SSH service is installed
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Ensure SSH listens on TCP port 22
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Port\\s+"
    line: "Port {{ network_ssh_port }}"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh

- name: Start and enable SSH service
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
