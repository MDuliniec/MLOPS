name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: PS5/Dockerfile
          ignore: DL3008
          failure-threshold: warning

  publish:
    needs: hadolint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: PS5
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply manifests to k3s
        run: |
          sed "s|__IMAGE_TAG__|${{ github.sha }}|g" PS5/k8s/deployment.yaml > /tmp/deployment-rendered.yaml
          sudo k3s kubectl apply -f /tmp/deployment-rendered.yaml
          sudo k3s kubectl apply -f PS5/k8s/service.yaml

      - name: Verify rollout and smoke test, roll back on failure
        run: |
          if ! sudo k3s kubectl rollout status deployment/mlops-ps5 --timeout=10m || ! python3 PS5/app/smoke_test.py; then
            sudo k3s kubectl rollout undo deployment/mlops-ps5
            exit 1
          fi
